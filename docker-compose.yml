# Local dependencies only — the API itself runs on the host via `npm run
# start:dev`, so a save is a restart rather than a rebuild.
#
#   docker compose up -d
#   npm run db:migrate
#   npm run start:dev

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cubeclash
      POSTGRES_PASSWORD: cubeclash
      POSTGRES_DB: cubeclash
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cubeclash -d cubeclash']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # Race state is reconstructible and leaderboards are caches, so durability
    # here would be a cost with no matching benefit.
    command: redis-server --save '' --appendonly no
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
